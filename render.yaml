services:
  - type: web
    name: futurestack-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set your Supabase or Neon PostgreSQL connection string here
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
